services:
  watcher:
    build: .
    restart: unless-stopped
    volumes:
      - /var/log/nginx:/logs:ro
      - ./data:/data
    environment:
      LOG_PATH: /logs/access.log
      DB_PATH: /data/nginx_ips.db
      # IGNORE_IPS: "127.0.0.1,::1,10.0.0.1"
      # Retry lookups that failed (rate limit / timeout). Defaults shown:
      # BACKFILL_INTERVAL: "900"   # seconds between retry sweeps
      # BACKFILL_BATCH: "25"       # max rows retried per sweep
      # WHOIS_DELAY: "2.0"         # seconds between live RDAP lookups
      # GeoJS (https://www.geojs.io) is the primary source; RDAP and the
      # offline GeoIP tables are the fallbacks. Defaults shown:
      # GEOJS: "1"                 # "0" disables it (GeoIP -> RDAP instead)
      # GEOJS_BATCH: "50"          # addresses per request
      # GEOJS_INTERVAL: "60"       # seconds between sweeps while GeoJS answers
      # GEOJS_TIMEOUT: "10"
      # Offline GeoIP tables are baked into the image (see Dockerfile) and are
      # the last resort (and the first whenever GeoJS is off). Override the
      # paths, or set both to "" to disable GeoIP:
      # GEOIP_COUNTRY_DB: /geoip/dbip-country-ipv4-num.csv,/geoip/dbip-country-ipv6-num.csv
      # GEOIP_ASN_DB: /geoip/iptoasn-asn-ipv4-num.csv,/geoip/iptoasn-asn-ipv6-num.csv
      # Per-IP request history, so the UI can count requests within a window:
      # HIT_BUCKET: "300"          # bucket width, seconds
      # HIT_RETENTION_DAYS: "8"    # history kept (must exceed the UI's 7d window)
      # PRUNE_INTERVAL: "3600"     # seconds between retention + labelling sweeps
      # Cloud/hosting/crawler marks. The published range files are baked into
      # the image; set to "" to rely on ASN data alone:
      # PROVIDER_DIR: /providers
      # LABEL_BATCH: "5000"        # unlabelled rows categorised per sweep
    command: ["python", "-u", "nginx-ipwatch.py"]

  web:
    build: .
    restart: unless-stopped
    volumes:
      - ./data:/data
    environment:
      DB_PATH: /data/nginx_ips.db
      # Manual WHOIS lookup (the 🔍 button / "Manual lookup" box in the UI).
      # Used when a registry has blocked this host from querying it directly.
      # Defaults shown:
      # PROXY_SOURCES: "geojs,ripestat,whoiscom"  # order to try; drop one to disable it
      # PROXY_LOOKUP_TIMEOUT: "15"          # seconds per HTTP request
      # RIPESTAT_SOURCEAPP: "nginx-ipwatch" # identifies us to RIPEstat
      # LOOKUP_MIN_INTERVAL: "2.0"          # min seconds between lookups, per worker
    command: ["gunicorn", "web:app", "--bind", "0.0.0.0:5000", "--workers", "2", "--timeout", "30"]
    ports:
      - "5000:5000"
    depends_on:
      - watcher
